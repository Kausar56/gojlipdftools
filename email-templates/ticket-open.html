<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New support ticket — Gojli</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#2663BB;height:6px;line-height:6px;font-size:0;">&nbsp;</td>
          </tr>
          <tr>
            <td align="center" style="padding:32px 24px 12px;">
              <img src="https://www.gojli.com/logo.png" width="48" height="48" alt="Gojli" style="display:block;border:0;border-radius:10px;">
              <div style="margin-top:10px;font-size:20px;font-weight:700;color:#0f172a;">Gojli</div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 40px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 16px;">
                <tr>
                  <td style="background:#eff6ff;color:#2663BB;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 14px;border-radius:999px;">New Ticket</td>
                </tr>
              </table>
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#0f172a;font-weight:700;text-align:center;">A new support ticket was opened</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.65;color:#334155;text-align:center;">
                <strong>{{userEmail}}</strong> opened ticket <strong>{{ticketNumber}}</strong>:
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;background:#f8fafc;border-radius:8px;">
                <tr>
                  <td style="padding:16px 18px;font-size:14px;color:#0f172a;font-weight:600;">
                    "{{subject}}"
                  </td>
                </tr>
              </table>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px;">
                <tr>
                  <td style="border-radius:8px;background:#2663BB;">
                    <a href="{{ticketUrl}}" style="display:inline-block;padding:14px 36px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">View Ticket</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc;padding:24px 40px;border-top:1px solid #e2e8f0;">
              <p style="margin:0 0 8px;font-size:12px;color:#64748b;line-height:1.6;">This is an automated notification from the Gojli support system.</p>
              <p style="margin:0;font-size:12px;color:#94a3b8;">&copy; 2026 Gojli. All rights reserved. &middot; <a href="https://www.gojli.com" style="color:#2663BB;text-decoration:none;">gojli.com</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
